name: Daily Ebay Product Extractor

on:
  schedule:
    - cron: '25 0 * * *'  # every day at 12:25 AM UTC
  workflow_dispatch:

jobs:
  ebay-product:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6  
        with:
          version: "0.7.21"

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # 4. Install project dependencies
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # 5. Run the data extraction script
      - name: Run extraction script
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: uv run main.py

      # 6. Upload new CSV to GitHub Release
      - name: Upload CSV to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ebay Product Export - Latest"
          body: "Latest daily CSV export"
          files: ebay_products.csv
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
